name: Build native addon (napi)

# Builds the @hathor/ct-crypto-node napi addon for every napi.targets platform
# and runs the Rust tests. On pull requests it is a build + test gate. On master
# and v* tag pushes (and manual runs) each platform's binary is uploaded as a
# bindings-<target> artifact.
#
# Distribution model (napi-rs v3): each platform ships as its own package
# (@hathor/ct-crypto-node-<platform>, e.g. -linux-x64-gnu), pulled in through
# the main package's optionalDependencies. A release publishes them from the v*
# tag run's artifacts, from a maintainer's machine (see RELEASING.md). No
# binaries are committed and nothing is published from CI.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE: '@hathor/ct-crypto-node'
  PACKAGE_DIR: packages/ct-crypto-node

jobs:
  build:
    name: Build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            smoke: true
          # Linux targets cross-build on the plain runner with napi-rs tooling.
          # The napi-rs docker images are frozen on a Node too old for
          # @napi-rs/cli 3 (the alpine ones ship Node 18, which lacks
          # node:util styleText) and their rustup fights rust-toolchain.toml.
          # `--use-napi-cross` keeps the glibc 2.17 floor the debian image
          # provided; musl targets build with cargo-zigbuild (zig below).
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build-flags: --use-napi-cross
            smoke: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build-flags: --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-flags: --cross-compile
            zig: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build-flags: --cross-compile
            zig: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # rust-toolchain.toml pins the toolchain; running `rustup target add`
      # from the repo root installs the component for THAT toolchain. (An
      # action-level `targets:` input applies to the toolchain the action
      # itself installs — the pinned one then lacked the cross target and
      # every cross build died with E0463 "can't find crate for `core`".)
      - name: Install Rust target for the pinned toolchain
        shell: bash
        run: rustup target add ${{ matrix.settings.target }}

      - name: Setup zig (musl cross builds)
        if: ${{ matrix.settings.zig }}
        shell: bash
        run: |
          ZIG_VERSION=0.13.0
          ZIG_SHA256=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig && sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          npm ci
          npm run build -w ${{ env.PACKAGE }} -- --target ${{ matrix.settings.target }} ${{ matrix.settings.build-flags }}

      # napi build regenerates index.js and index.d.ts. The committed copies are
      # what gets published, so they must be exactly what the build generates.
      # (Skipped on Windows, where the checkout has CRLF line endings.)
      - name: Check the committed loader and typings
        if: runner.os != 'Windows'
        run: git diff --exit-code -- ${{ env.PACKAGE_DIR }}/index.js ${{ env.PACKAGE_DIR }}/index.d.ts

      # Run the binary just built through the loader, on the hosts that can
      # execute their own target. The release also smoke-tests the Linux
      # binaries in containers and darwin-arm64 locally; darwin-x64 is only
      # format-checked.
      - name: Load the built addon
        if: ${{ matrix.settings.smoke }}
        shell: bash
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          node -e '
            const ct = require("./index.js");
            const c = ct.createCommitment(1000n, ct.generateRandomBlindingFactor(), ct.htrAssetTag());
            if (!ct.validateCommitment(c)) throw new Error("commitment does not validate");
            console.log("loaded and ran on", process.platform, process.arch);
          '

      - name: Upload binary
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.PACKAGE_DIR }}/*.node
          if-no-files-found: error

  # Rust unit tests across the workspace (binding features included).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # The NAPI binding itself is jest-tested in the `node` job of ci.yml; here
      # we cargo-test its crypto logic (crypto-core) + the mobile UniFFI crate.
      # Excluded: the #[napi] glue can't link a standalone test binary (napi-rs 3).
      - run: cargo test --workspace --exclude hathor-ct-crypto-node --locked
